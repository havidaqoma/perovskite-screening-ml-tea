name: CI
on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies (light set; full pinned deps in requirements.txt)
        run: pip install -r requirements-ci.txt
      - name: Offline demo (ships real data; runs the TEA engine end to end)
        run: python examples/quickstart_tea.py
      - name: Test suite (offline, no API key)
        run: python -m pytest -q
